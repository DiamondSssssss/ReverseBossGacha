server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # SPA / static — ES modules cần đúng MIME
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|mjs|css|png|jpg|jpeg|gif|ico|svg|woff2?|json)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Không cache index để nhận bản mới sau deploy
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
