<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ebe4d6" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Sếp Tổng Hầm Ngục</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700;1,9..40,400&family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/base.css?v=92" />
  <link rel="stylesheet" href="css/hub.css?v=92" />
  <link rel="stylesheet" href="css/gacha.css?v=92" />
  <link rel="stylesheet" href="css/setup.css?v=92" />
  <link rel="stylesheet" href="css/combat.css?v=92" />
  <link rel="stylesheet" href="css/tutorial.css?v=92" />
  <link rel="stylesheet" href="css/auth.css?v=92" />
  <link rel="stylesheet" href="css/leaderboard.css?v=92" />
  <link rel="stylesheet" href="css/admin.css?v=92" />
</head>
<body>
  <div class="grain" aria-hidden="true"></div>
  <div class="app">
    <header class="topbar">
      <div class="topbar-row">
        <div class="resources" id="resources" aria-label="Tài nguyên"></div>
        <div class="topbar-actions">
          <div id="account-slot"></div>
          <button type="button" class="topbar-lb-btn" id="btn-top-lb" title="Bảng xếp hạng">BXH</button>
        </div>
      </div>
    </header>

    <div id="tip-slot"></div>

    <main class="screens">
      <section class="screen active" id="screen-hub" data-screen="hub"></section>
      <section class="screen" id="screen-challenges" data-screen="challenges"></section>
      <section class="screen" id="screen-gacha" data-screen="gacha"></section>
      <section class="screen" id="screen-collection" data-screen="collection"></section>
      <section class="screen" id="screen-heroes" data-screen="heroes"></section>
      <section class="screen" id="screen-leaderboard" data-screen="leaderboard"></section>
      <section class="screen" id="screen-achievements" data-screen="achievements"></section>
      <section class="screen" id="screen-scout" data-screen="scout"></section>
      <section class="screen" id="screen-setup" data-screen="setup"></section>
      <section class="screen" id="screen-combat" data-screen="combat"></section>
      <section class="screen" id="screen-reward" data-screen="reward"></section>
      <section class="screen" id="screen-admin" data-screen="admin"></section>
    </main>

    <nav class="nav-dock" id="nav-dock">
      <button type="button" data-nav="hub" class="active"><span class="nav-ico" data-ico="home"></span>Sảnh</button>
      <button type="button" data-nav="gacha"><span class="nav-ico" data-ico="spin"></span>Quay</button>
      <button type="button" data-nav="collection"><span class="nav-ico" data-ico="box"></span>Kho</button>
      <button type="button" data-nav="achievements"><span class="nav-ico" data-ico="seal"></span>Ấn</button>
      <button type="button" data-nav="scout" class="nav-raid"><span class="nav-ico" data-ico="gate"></span>Vào ải</button>
    </nav>
  </div>

  <div class="toast" id="toast"></div>
  <div class="modal-backdrop" id="modal"></div>

  <script type="module" src="js/main.js?v=92"></script>
</body>
</html>
