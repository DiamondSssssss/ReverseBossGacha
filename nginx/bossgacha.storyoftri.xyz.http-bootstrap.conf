# HTTP bootstrap — Certbot sẽ thêm HTTPS.
# Frontend 25568 · Backend 3007

upstream bossgacha_backend {
    server 127.0.0.1:3007;
}

upstream bossgacha_frontend {
    server 127.0.0.1:25568;
}

server {
    listen 80;
    listen [::]:80;
    server_name bossgacha.storyoftri.xyz;

    location /api/ {
        proxy_pass http://bossgacha_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://bossgacha_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
