# HTTP bootstrap — Certbot sẽ thêm HTTPS.
# Port frontend VPS: 25568 (không đụng BongMa 25566 / GameBanCa 25567)

upstream bossgacha_frontend {
    server 127.0.0.1:25568;
}

server {
    listen 80;
    listen [::]:80;
    server_name bossgacha.storyoftri.xyz;

    location / {
        proxy_pass http://bossgacha_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
